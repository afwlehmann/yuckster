name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deps:
    name: Dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Restore node_modules cache
        id: cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: nix develop -c bash -c "npm ci"

  build:
    name: Build
    needs: deps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Restore node_modules cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Build
        run: nix develop -c bash -c "npm run build"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: yuckster-dist
          path: dist/
          retention-days: 30
          if-no-files-found: error

  lint:
    name: Lint
    needs: deps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Restore node_modules cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Lint
        run: nix develop -c bash -c "npm run lint"

      - name: Format check
        run: nix develop -c bash -c "npm run format:check"

      - name: Typecheck
        run: nix develop -c bash -c "npm run typecheck"

  test:
    name: Test
    needs: deps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Restore node_modules cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Test
        run: nix develop -c bash -c "npm test"

  publish:
    name: Publish
    needs: [build, lint, test, deps]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Restore node_modules cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Build
        run: nix develop -c bash -c "npm run build"

      - name: Package distribution archive
        run: |
          tar -czf yuckster-${{ github.sha }}.tar.gz -C dist .
          zip -r -q yuckster-${{ github.sha }}.zip dist/

      - name: Upload release artifact (tar.gz)
        uses: actions/upload-artifact@v7
        with:
          name: yuckster-${{ github.sha }}-tarball
          path: yuckster-${{ github.sha }}.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Upload release artifact (zip)
        uses: actions/upload-artifact@v7
        with:
          name: yuckster-${{ github.sha }}-zip
          path: yuckster-${{ github.sha }}.zip
          retention-days: 90
          if-no-files-found: error

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
